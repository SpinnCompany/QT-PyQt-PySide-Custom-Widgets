name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest
          pip install -e .[all]

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        run: pytest -q

  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The linter is pure stdlib and `import Custom_Widgets` is import-light
      # (lazy root) — the Qt libraries below are belt-and-braces for tooling
      # paths that still construct widgets.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip install -e .

      - name: Design rules (glyph icons / hardcoded hex / drop shadows)
        run: python -m Custom_Widgets.lint --format github

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Widget stubs are up to date
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        run: |
          python -m Custom_Widgets.mcp.stubgen --write
          git diff --exit-code -- '*.pyi' Custom_Widgets/py.typed \
            || { echo "::error::Widget stubs are stale — run: python -m Custom_Widgets.mcp.stubgen --write"; exit 1; }

      - name: Type-check widget stubs
        run: mypy

  example-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip install -e .[all]

      # Boots a flagship subset headless and grabs each window. The survey tool
      # exits nonzero if any app crashes, hangs, renders blank, or shows no
      # window (blank detection added 2026-08: a form that "runs" but paints
      # nothing used to pass the gate). First boot on a fresh runner spends
      # tens of seconds generating the app icon set, hence the generous timeout.
      - name: Boot flagship examples headless
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/survey_examples.py /tmp/survey \
            --only="WinningDashboard_CorrectArchitecture,GlassHome,NewWidgetsShowcase,DesignTokens,QCustomDataTable" \
            --timeout=300

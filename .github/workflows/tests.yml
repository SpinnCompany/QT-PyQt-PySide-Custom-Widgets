name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest
          pip install -e .[all]

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        run: pytest -q

  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The linter itself is pure stdlib, but importing the package pulls
      # qtpy → QtWidgets → the full GUI stack, so the runner needs the same
      # Qt system libraries as the test jobs (libEGL and friends).
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip install -e .

      - name: Design rules (glyph icons / hardcoded hex / drop shadows)
        run: python -m Custom_Widgets.lint --format github

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-cursor0 libdbus-1-3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Widget stubs are up to date
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        run: |
          python -m Custom_Widgets.mcp.stubgen --write
          git diff --exit-code -- '*.pyi' Custom_Widgets/py.typed \
            || { echo "::error::Widget stubs are stale — run: python -m Custom_Widgets.mcp.stubgen --write"; exit 1; }

      - name: Type-check widget stubs
        run: mypy
